<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | PhantomHack</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #1a1a1a;
        color: #d0d0d0;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 15px;
        line-height: 1.7;
        padding: 40px 20px;
      }

      .container {
        max-width: 820px;
        margin: 0 auto;
      }

      h1 { font-size: 1.8em; color: #ffffff; margin-bottom: 8px; }
      h2 { font-size: 1.3em; color: #cccccc; margin-top: 36px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px; }
      h3 { font-size: 1.05em; color: #aaaaaa; margin-top: 24px; margin-bottom: 8px; }

      p { margin-bottom: 12px; }

      ul { padding-left: 20px; margin-bottom: 12px; }
      ul li { margin-bottom: 6px; }

      blockquote {
        border-left: 3px solid #555;
        padding-left: 14px;
        color: #888;
        margin: 16px 0;
        font-style: italic;
      }

      a { color: #7eb8f7; text-decoration: none; }
      a:hover { text-decoration: underline; }

      hr { border: none; border-top: 1px solid #333; margin: 28px 0; }

      strong { color: #ffffff; }

      code {
        background: #2a2a2a;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      {{ content }}
    </div>
  </body>
</html>
